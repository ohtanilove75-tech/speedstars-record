<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SPEED STARS RECORD</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0b0f;
  color: white;
}

header {
  text-align: center;
  padding: 30px 20px;
  background: #15151c;
}

h1 {
  margin: 0;
  font-size: 30px;
}

.subtitle {
  color: #aaa;
  margin-top: 8px;
}

.container {
  max-width: 650px;
  margin: auto;
  padding: 20px;
}

.card {
  background: #17171f;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 20px;
}

h2 {
  margin-top: 0;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 6px;
  color: #ccc;
}

select,
input,
button {
  width: 100%;
  padding: 13px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
}

button {
  margin-top: 20px;
  font-weight: bold;
  background: white;
  color: black;
  cursor: pointer;
}

button:hover {
  opacity: 0.85;
}

.result {
  background: #22222c;
  padding: 15px;
  border-radius: 12px;
  margin-top: 15px;
}

.record {
  border-top: 1px solid #333;
  padding: 15px 0;
}

.record:first-child {
  border-top: none;
}

.best {
  font-size: 24px;
  font-weight: bold;
}

.good {
  margin-top: 8px;
}

.warning {
  margin-top: 8px;
}

canvas {
  width: 100%;
  height: 280px;
  background: #111116;
  border-radius: 12px;
  margin-top: 15px;
}

.graph-info {
  color: #aaa;
  font-size: 13px;
  margin-top: 10px;
}
</style>
</head>

<body>

<header>
  <h1>⚡ SPEED STARS RECORD</h1>
  <div class="subtitle">Track your speed. Beat your best.</div>
</header>

<div class="container">

  <!-- 記録入力 -->
  <div class="card">

    <h2>🏃 記録を入力</h2>

    <label>種目</label>

    <select id="event">
      <option>40yd</option>
      <option>60m</option>
      <option>60H</option>
      <option>100m</option>
      <option>110H</option>
      <option>150m</option>
      <option>200m</option>
      <option>300m</option>
      <option>400H</option>
      <option>4×100m</option>
    </select>

    <label>タイム（秒）</label>

    <input
      id="time"
      type="number"
      step="0.01"
      placeholder="例：12.34"
    >

    <label>歩幅（m）</label>

    <input
      id="stride"
      type="number"
      step="0.01"
      placeholder="例：2.10"
    >

    <label>最高速度（km/h）</label>

    <input
      id="speed"
      type="number"
      step="0.1"
      placeholder="例：32.5"
    >

    <button onclick="saveRecord()">
      💾 記録を保存
    </button>

  </div>


  <!-- AI分析 -->
  <div class="card">

    <h2>🤖 AI分析</h2>

    <div id="analysis">
      記録を入力すると分析します。
    </div>

  </div>


  <!-- 世界記録 -->
  <div class="card">

    <h2>🌎 世界記録との差</h2>

    <div id="worldComparison">
      まだ記録がありません。
    </div>

  </div>


  <!-- 自己ベスト -->
  <div class="card">

    <h2>🏆 自己ベスト</h2>

    <div id="best">
      まだ記録がありません。
    </div>

  </div>


  <!-- グラフ -->
  <div class="card">

    <h2>📈 成長グラフ</h2>

    <label>種目</label>

    <select id="graphEvent" onchange="drawGraph()">
      <option>40yd</option>
      <option>60m</option>
      <option>60H</option>
      <option>100m</option>
      <option>110H</option>
      <option>150m</option>
      <option>200m</option>
      <option>300m</option>
      <option>400H</option>
      <option>4×100m</option>
    </select>

    <label>表示するデータ</label>

    <select id="graphType" onchange="drawGraph()">
      <option value="time">📈 タイム</option>
      <option value="stride">👣 歩幅</option>
      <option value="speed">💨 最高速度</option>
    </select>

    <canvas id="recordChart"></canvas>

    <div class="graph-info" id="graphInfo">
      種目とデータを選択してください
    </div>

  </div>


  <!-- 記録履歴 -->
  <div class="card">

    <h2>📊 記録履歴</h2>

    <div id="records">
      まだ記録がありません。
    </div>

  </div>

</div>


<script>

/* =========================
   世界記録
========================= */

const worldRecords = {
  "40yd": 3.82,
  "60m": 5.88,
  "60H": 5.94,
  "100m": 8.75,
  "110H": 9.88,
  "150m": 12.29,
  "200m": 16.64,
  "300m": 25.50,
  "400H": 37.57,
  "4×100m": 30.00
};


/* =========================
   保存データ
========================= */

let records =
  JSON.parse(
    localStorage.getItem("speedstarsRecords")
  ) || [];


/* =========================
   記録保存
========================= */

function saveRecord() {

  const event =
    document.getElementById("event").value;

  const time =
    parseFloat(
      document.getElementById("time").value
    );

  const stride =
    parseFloat(
      document.getElementById("stride").value
    ) || 0;

  const speed =
    parseFloat(
      document.getElementById("speed").value
    ) || 0;


  if (!time || time <= 0) {

    alert("タイムを入力してください！");

    return;
  }


  const previousRecords =
    records.filter(
      r => r.event === event
    );


  const previous =
    previousRecords.length > 0
      ? previousRecords[
          previousRecords.length - 1
        ]
      : null;


  const record = {

    event: event,

    time: time,

    stride: stride,

    speed: speed,

    date:
      new Date().toLocaleDateString(
        "ja-JP"
      )

  };


  records.push(record);


  localStorage.setItem(
    "speedstarsRecords",
    JSON.stringify(records)
  );


  document.getElementById("time").value = "";

  document.getElementById("stride").value = "";

  document.getElementById("speed").value = "";


  showBest();

  showRecords();

  showAnalysis(
    record,
    previous
  );

  showWorldComparison(
    record
  );

  drawGraph();

}


/* =========================
   AI分析
========================= */

function showAnalysis(
  record,
  previous
) {

  let html =
    "<div class='result'>";


  html +=
    "<strong>🤖 自動分析</strong>";


  if (record.speed > 0) {

    if (record.speed >= 30) {

      html +=
        "<div class='good'>" +
        "💨 最高速度が高く、スピード能力が強みです。" +
        "</div>";

    } else {

      html +=
        "<div class='warning'>" +
        "💨 最高速度をさらに伸ばせる可能性があります。" +
        "</div>";

    }

  }


  if (record.stride > 0) {

    if (record.stride >= 2) {

      html +=
        "<div class='good'>" +
        "👣 歩幅を活かした走りができています。" +
        "</div>";

    } else {

      html +=
        "<div class='warning'>" +
        "👣 歩幅を安定させることがポイントです。" +
        "</div>";

    }

  }


  if (previous) {

    const difference =
      previous.time - record.time;


    if (difference > 0) {

      html +=
        "<div class='good'>" +
        "🔥 前回より " +
        difference.toFixed(2) +
        "秒更新しました！" +
        "</div>";

    }

    else if (difference < 0) {

      html +=
        "<div class='warning'>" +
        "📈 前回より " +
        Math.abs(
          difference
        ).toFixed(2) +
        "秒遅くなっています。" +
        "</div>";

    }

    else {

      html +=
        "<div>" +
        "➡️ 前回と同じタイムです。" +
        "</div>";

    }

  }

  else {

    html +=
      "<div>" +
      "🆕 この種目の最初の記録です！" +
      "</div>";

  }


  html +=
    "</div>";


  document.getElementById(
    "analysis"
  ).innerHTML = html;

}


/* =========================
   世界記録比較
========================= */

function showWorldComparison(
  record
) {

  const world =
    worldRecords[
      record.event
    ];


  if (!world) return;


  const difference =
    record.time - world;


  let html =
    "<div class='result'>";


  html +=
    "🌎 世界記録：<strong>" +
    world.toFixed(2) +
    "秒</strong><br><br>";


  html +=
    "🏃 あなたの記録：<strong>" +
    record.time.toFixed(2) +
    "秒</strong><br><br>";


  html +=
    "⏱️ 世界記録との差：<strong>" +
    difference.toFixed(2) +
    "秒</strong>";


  html +=
    "</div>";


  document.getElementById(
    "worldComparison"
  ).innerHTML = html;

}


/* =========================
   自己ベスト
========================= */

function showBest() {

  const bestArea =
    document.getElementById(
      "best"
    );


  if (records.length === 0) {

    bestArea.innerHTML =
      "まだ記録がありません";

    return;

  }


  const bests = {};


  records.forEach(
    record => {

      if (

        !bests[record.event] ||

        record.time <
        bests[record.event].time

      ) {

        bests[
          record.event
        ] = record;

      }

    }
  );


  let html = "";


  Object.values(
    bests
  ).forEach(
    record => {

      html += `

        <div class="record">

          🥇 ${record.event}

          <span class="best">

            ${record.time.toFixed(2)}秒

          </span>

        </div>

      `;

    }
  );


  bestArea.innerHTML = html;

}


/* =========================
   記録履歴
========================= */

function showRecords() {

  const area =
    document.getElementById(
      "records"
    );


  if (records.length === 0) {

    area.innerHTML =
      "まだ記録がありません";

    return;

  }


  let html = "";


  records
    .slice()
    .reverse()
    .forEach(
      record => {

        html += `

          <div class="record">

            <strong>
              ${record.event}
            </strong>

            <br>

            ⏱️
            ${record.time.toFixed(2)}秒

            <br>

            👣 歩幅：
            ${record.stride.toFixed(2)}m

            <br>

            💨 最高速度：
            ${record.speed.toFixed(1)}km/h

            <br>

            📅
            ${record.date}

          </div>

        `;

      }
    );


  area.innerHTML = html;

}


/* =========================
   グラフ
========================= */

function drawGraph() {

  const canvas =
    document.getElementById(
      "recordChart"
    );


  const ctx =
    canvas.getContext("2d");


  const event =
    document.getElementById(
      "graphEvent"
    ).value;


  const graphType =
    document.getElementById(
      "graphType"
    ).value;


  const info =
    document.getElementById(
      "graphInfo"
    );


  const data =
    records.filter(
      r =>
        r.event === event
    );


  const width =
    canvas.clientWidth;


  const height = 280;


  canvas.width = width;

  canvas.height = height;


  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  if (data.length === 0) {

    ctx.fillStyle = "white";

    ctx.font =
      "16px Arial";


    ctx.fillText(
      "この種目の記録がありません",
      20,
      40
    );


    info.innerHTML =
      "記録を追加するとグラフが表示されます";

    return;

  }


  /* グラフのデータ設定 */

  let values;

  let title;

  let unit;


  if (
    graphType === "time"
  ) {

    values =
      data.map(
        r => r.time
      );

    title =
      "📈 タイム推移";

    unit =
      "秒";

  }


  if (
    graphType === "stride"
  ) {

    values =
      data.map(
        r => r.stride
      );

    title =
      "👣 歩幅推移";

    unit =
      "m";

  }


  if (
    graphType === "speed"
  ) {

    values =
      data.map(
        r => r.speed
      );

    title =
      "💨 最高速度推移";

    unit =
      "km/h";

  }


  /* データがない場合 */

  if (
    values.every(
      value => value === 0
    )
  ) {

    ctx.fillStyle = "white";

    ctx.font =
      "16px Arial";


    ctx.fillText(
      "このデータがありません",
      20,
      40
    );


    info.innerHTML =
      "記録入力時にこのデータを追加してください";

    return;

  }


  const padding = 45;


  let min =
    Math.min(
      ...values
    );


  let max =
    Math.max(
      ...values
    );


  if (min === max) {

    min -= 1;

    max += 1;

  }


  /* 背景の軸 */

  ctx.strokeStyle =
    "#555";


  ctx.lineWidth = 1;


  ctx.beginPath();


  ctx.moveTo(
    padding,
    20
  );


  ctx.lineTo(
    padding,
    height - padding
  );


  ctx.lineTo(
    width - 20,
    height - padding
  );


  ctx.stroke();


  /* タイムの場合は
     小さい数字が上になるようにする */

  function getY(value) {

    if (
      graphType === "time"
    ) {

      return (
        20 +

        (
          (value - min) /
          (max - min)
        )

        *

        (
          height -
          padding -
          30
        )

      );

    }


    return (

      height -
      padding -

      (
        (value - min) /
        (max - min)
      )

      *

      (
        height -
        padding -
        30
      )

    );

  }


  /* データ線 */

  ctx.strokeStyle =
    "#ffffff";


  ctx.lineWidth = 3;


  ctx.beginPath();


  data.forEach(
    (
      record,
      i
    ) => {

      const value =
        values[i];


      const x =

        data.length === 1

          ? width / 2

          : padding +

            (
              i /
              (
                data.length - 1
              )
            )

            *

            (
              width -
              padding -
              25
            );


      const y =
        getY(value);


      if (i === 0) {

        ctx.moveTo(
          x,
          y
        );

      }

      else {

        ctx.lineTo(
          x,
          y
        );

      }

    }
  );


  ctx.stroke();


  /* ポイント */

  data.forEach(
    (
      record,
      i
    ) => {

      const value =
        values[i];


      const x =

        data.length === 1

          ? width / 2

          : padding +

            (
              i /
              (
                data.length - 1
              )
            )

            *

            (
              width -
              padding -
              25
            );


      const y =
        getY(value);


      ctx.fillStyle =
        "white";


      ctx.beginPath();


      ctx.arc(
        x,
        y,
        5,
        0,
        Math.PI * 2
      );


      ctx.fill();


      ctx.font =
        "12px Arial";


      ctx.fillText(

        value.toFixed(
          graphType === "speed"
            ? 1
            : 2
        ) + unit,

        x - 15,
        y - 10

      );

    }
  );


  /* 下の文字 */

  ctx.fillStyle =
    "#aaa";


  ctx.font =
    "12px Arial";


  ctx.fillText(
    "過去",
    padding,
    height - 10
  );


  ctx.fillText(
    "最新",
    width - 45,
    height - 10
  );


  /* グラフ説明 */

  info.innerHTML =

    "<strong>" +
    title +
    "</strong><br>" +

    "最高値： " +

    max.toFixed(
      graphType === "speed"
        ? 1
        : 2
    ) +

    unit +

    " ／ 最低値： " +

    min.toFixed(
      graphType === "speed"
        ? 1
        : 2
    ) +

    unit;

}


/* =========================
   起動
========================= */

showBest();

showRecords();

drawGraph();

</script>

</body>
</html>

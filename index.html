<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPEED STARS RECORD</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0b0f;
  color: white;
}

header {
  text-align: center;
  padding: 30px 20px;
  background: #15151c;
}

h1 {
  margin: 0;
  font-size: 30px;
}

.subtitle {
  color: #aaa;
  margin-top: 8px;
}

.container {
  max-width: 650px;
  margin: auto;
  padding: 20px;
}

.card {
  background: #17171f;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 20px;
}

h2 {
  margin-top: 0;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 6px;
  color: #ccc;
}

select,
input,
button {
  width: 100%;
  padding: 13px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
}

button {
  margin-top: 20px;
  font-weight: bold;
  background: white;
  color: black;
}

button:hover {
  opacity: 0.85;
}

.result {
  background: #22222c;
  padding: 15px;
  border-radius: 12px;
  margin-top: 15px;
}

.record {
  border-top: 1px solid #333;
  padding: 15px 0;
}

.record:first-child {
  border-top: none;
}

.best {
  font-size: 25px;
  font-weight: bold;
}

.good {
  margin-top: 8px;
}

.warning {
  margin-top: 8px;
}

.small {
  color: #aaa;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <h1>⚡ SPEED STARS RECORD</h1>
  <div class="subtitle">Track your speed. Beat your best.</div>
</header>

<div class="container">

  <!-- 記録入力 -->
  <div class="card">
    <h2>🏃 記録を入力</h2>

    <label>種目</label>
    <select id="event">
      <option>40yd</option>
      <option>60m</option>
      <option>60H</option>
      <option>100m</option>
      <option>110H</option>
      <option>150m</option>
      <option>200m</option>
      <option>300m</option>
      <option>400H</option>
      <option>4×100m</option>
    </select>

    <label>タイム（秒）</label>
    <input id="time" type="number" step="0.01" placeholder="例：12.34">

    <label>歩幅（m）</label>
    <input id="stride" type="number" step="0.01" placeholder="例：2.10">

    <label>最高速度（km/h）</label>
    <input id="speed" type="number" step="0.1" placeholder="例：32.5">

    <button onclick="saveRecord()">💾 記録を保存</button>
  </div>

  <!-- AI分析 -->
  <div class="card">
    <h2>🤖 AI分析</h2>
    <div id="analysis">
      記録を入力すると分析します。
    </div>
  </div>

  <!-- 世界記録比較 -->
  <div class="card">
    <h2>🌎 世界記録との差</h2>
    <div id="worldComparison">
      まだ記録がありません。
    </div>
  </div>

  <!-- 自己ベスト -->
  <div class="card">
    <h2>🏆 自己ベスト</h2>
    <div id="best">
      まだ記録がありません。
    </div>
  </div>

  <!-- 履歴 -->
  <div class="card">
    <div class="card">
  <h2>📈 タイム推移</h2>

  <label>グラフに表示する種目</label>

  <select id="graphEvent" onchange="drawGraph()">
    <option>100m</option>
    <option>40yd</option>
    <option>60m</option>
    <option>60H</option>
    <option>110H</option>
    <option>150m</option>
    <option>200m</option>
    <option>300m</option>
    <option>400H</option>
    <option>4×100m</option>
  </select>

  <canvas id="recordChart" height="250"></canvas>
</div>
    <h2>📊 記録履歴</h2>
    <div id="records">
      まだ記録がありません。
    </div>
  </div>

</div>

<script>

/* =========================
   世界記録
========================= */

const worldRecords = {
  "40yd": 3.82,
  "60m": 5.88,
  "60H": 5.94,
  "100m": 8.75,
  "110H": 9.88,
  "150m": 12.29,
  "200m": 16.64,
  "300m": 25.50,
  "400H": 37.57,
  "4×100m": 30.00
};


/* =========================
   保存データ
========================= */

let records =
  JSON.parse(localStorage.getItem("speedstarsRecords")) || [];


/* =========================
   記録保存
========================= */

function saveRecord() {

  const event =
    document.getElementById("event").value;

  const time =
    parseFloat(document.getElementById("time").value);

  const stride =
    parseFloat(document.getElementById("stride").value) || 0;

  const speed =
    parseFloat(document.getElementById("speed").value) || 0;

  if (!time || time <= 0) {
    alert("タイムを入力してください！");
    return;
  }

  const previousRecords =
    records.filter(r => r.event === event);

  const previous =
    previousRecords.length > 0
      ? previousRecords[previousRecords.length - 1]
      : null;

  const record = {
    event: event,
    time: time,
    stride: stride,
    speed: speed,
    date: new Date().toLocaleDateString("ja-JP")
  };

  records.push(record);

  localStorage.setItem(
    "speedstarsRecords",
    JSON.stringify(records)
  );

  document.getElementById("time").value = "";
  document.getElementById("stride").value = "";
  document.getElementById("speed").value = "";

  showBest();
  showRecords();
  showAnalysis(record, previous);
  showWorldComparison(record);
}


/* =========================
   AI分析
========================= */

function showAnalysis(record, previous) {

  let html = "";

  html += "<div class='result'>";

  html += "<strong>🤖 自動分析</strong>";

  if (record.speed >= 30) {
    html += "<div class='good'>💨 最高速度は高めです。スピード能力が強みです。</div>";
  } else if (record.speed > 0) {
    html += "<div class='warning'>💨 最高速度をさらに伸ばせる余地があります。</div>";
  }

  if (record.stride >= 2) {
    html += "<div class='good'>👣 歩幅をしっかり活かせています。</div>";
  } else if (record.stride > 0) {
    html += "<div class='warning'>👣 歩幅を安定させることがポイントです。</div>";
  }

  if (previous) {

    const difference =
      previous.time - record.time;

    if (difference > 0) {

      html +=
        "<div class='good'>🔥 前回より " +
        difference.toFixed(2) +
        "秒更新しました！</div>";

    } else if (difference < 0) {

      html +=
        "<div class='warning'>📈 前回より " +
        Math.abs(difference).toFixed(2) +
        "秒遅くなっています。フォームやコンディションを確認してみましょう。</div>";

    } else {

      html +=
        "<div>➡️ 前回と同じタイムです。</div>";
    }

  } else {

    html +=
      "<div>🆕 この種目の最初の記録です！</div>";
  }

  html += "</div>";

  document.getElementById("analysis").innerHTML = html;
}


/* =========================
   世界記録比較
========================= */

function showWorldComparison(record) {

  const world =
    worldRecords[record.event];

  if (!world) {
    return;
  }

  const difference =
    record.time - world;

  let html = "";

  html += "<div class='result'>";

  html +=
    "🌎 世界記録：<strong>" +
    world.toFixed(2) +
    "秒</strong><br><br>";

  html +=
    "🏃 あなたの記録：<strong>" +
    record.time.toFixed(2) +
    "秒</strong><br><br>";

  html +=
    "⏱️ 世界記録との差：<strong>" +
    difference.toFixed(2) +
    "秒</strong>";

  html += "</div>";

  document.getElementById("worldComparison").innerHTML = html;
}


/* =========================
   自己ベスト
========================= */

function showBest() {

  const bestArea =
    document.getElementById("best");

  if (records.length === 0) {
    bestArea.innerHTML =
      "まだ記録がありません";
    return;
  }

  const bests = {};

  records.forEach(record => {

    if (
      !bests[record.event] ||
      record.time < bests[record.event].time
    ) {
      bests[record.event] = record;
    }

  });

  let html = "";

  Object.values(bests).forEach(record => {

    html += `
      <div class="record">
        🥇 ${record.event}
        <span class="best">
          ${record.time.toFixed(2)}秒
        </span>
      </div>
    `;

  });

  bestArea.innerHTML = html;
}


/* =========================
   履歴
========================= */

function showRecords() {

  const area =
    document.getElementById("records");

  if (records.length === 0) {
    area.innerHTML =
      "まだ記録がありません";
    return;
  }

  let html = "";

  records.slice().reverse().forEach(record => {

    html += `
      <div class="record">

        <strong>${record.event}</strong><br>

        ⏱️ ${record.time.toFixed(2)}秒<br>

        👣 歩幅：
        ${record.stride.toFixed(2)}m<br>

        💨 最高速度：
        ${record.speed.toFixed(1)}km/h<br>

        📅 ${record.date}

      </div>
    `;

  });

  area.innerHTML = html;
}


/* =========================
   起動時表示
========================= */

showBest();
showRecords();

if (records.length > 0) {

  const latest =
    records[records.length - 1];

  const sameEvent =
    records.filter(
      r => r.event === latest.event
    );

  const previous =
    sameEvent.length > 1
      ? sameEvent[sameEvent.length - 2]
      : null;

  showAnalysis(latest, previous);
  showWorldComparison(latest);
}
function drawGraph() {
  const event = document.getElementById("graphEvent").value;
  const canvas = document.getElementById("recordChart");
  const ctx = canvas.getContext("2d");

  const data = records.filter(r => r.event === event);

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (data.length === 0) {
    ctx.font = "16px Arial";
    ctx.fillText("まだ記録がありません", 20, 40);
    return;
  }

  const width = canvas.width;
  const height = canvas.height;

  const padding = 40;

  const times = data.map(r => r.time);

  const minTime = Math.min(...times);
  const maxTime = Math.max(...times);

  const range =
    maxTime - minTime === 0
      ? 1
      : maxTime - minTime;

  ctx.beginPath();

  data.forEach((r, i) => {

    const x =
      padding +
      (i / Math.max(data.length - 1, 1)) *
      (width - padding * 2);

    const y =
      height -
      padding -
      ((r.time - minTime) / range) *
      (height - padding * 2);

    if (i === 0) {
      ctx.moveTo(x, y);
    } else {
      ctx.lineTo(x, y);
    }

  });

  ctx.stroke();

  data.forEach((r, i) => {

    const x =
      padding +
      (i / Math.max(data.length - 1, 1)) *
      (width - padding * 2);

    const y =
      height -
      padding -
      ((r.time - minTime) / range) *
      (height - padding * 2);

    ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.font = "12px Arial";
    ctx.fillText(
      r.time.toFixed(2),
      x - 12,
      y - 10
    );

  });

  ctx.font = "12px Arial";
  ctx.fillText("← 過去", 10, height - 10);
  ctx.fillText("最新 →", width - 55, height - 10);
}drawGraph();
</script>
<div class="card">
  <h2>📈 タイム推移</h2>

  <label>グラフに表示する種目</label>

  <select id="graphEvent" onchange="drawGraph()">
    <option>100m</option>
    <option>40yd</option>
    <option>60m</option>
    <option>60H</option>
    <option>110H</option>
    <option>150m</option>
    <option>200m</option>
    <option>300m</option>
    <option>400H</option>
    <option>4×100m</option>
  </select>

  <canvas id="recordChart" height="250"></canvas>
</div>
</body>

</html>
